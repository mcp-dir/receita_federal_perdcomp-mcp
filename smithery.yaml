# Smithery configuration for Receita Federal PER: DCOMP
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_receita_federal_perdcomp

name: receita_federal_perdcomp-mcp
displayName: "Receita Federal PER: DCOMP"
description: >
  Receita Federal PER: DCOMP, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/receita_federal_perdcomp-mcp
repository: https://github.com/mcp-dir/receita_federal_perdcomp-mcp

tags:
  - receita_federal_perdcomp
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_receita_federal_perdcomp

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_receita_federal_perdcomp/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
